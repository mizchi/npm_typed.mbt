name: check-env

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-env:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Moon
        uses: chawyehsu/setup-moonup@v1
        with:
          moonbit-version: latest

      - name: moon version
        run: |
          moon version --all

      - name: install module dependencies
        run: |
          moon update
          moon install

      - name: moon build
        run: moon build --target js

      - name: deno test
        run: |
          if [ -n "$(find . -name '*.test.ts' -not -path './node_modules/*' -not -path './.mooncakes/*' 2>/dev/null)" ]; then
            deno test -A --ignore=.mooncakes,node_modules
          else
            echo "No deno test files found, skipping"
          fi
